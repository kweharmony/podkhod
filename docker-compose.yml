services:
  db:
    image: postgres:17-alpine
    container_name: podkhod-db
    environment:
      POSTGRES_USER: podkhod
      POSTGRES_PASSWORD: podkhod
      POSTGRES_DB: podkhod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podkhod"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
